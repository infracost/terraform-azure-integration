name: Script checks

on:
  pull_request:
    paths:
      - scripts/**
      - .github/workflows/scripts.yml
  push:
    branches:
      - main
    paths:
      - scripts/**
      - .github/workflows/scripts.yml

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: scripts/linux
        run: shellcheck -x -S style setup.sh teardown.sh

  shfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSL -o /usr/local/bin/shfmt https://github.com/mvdan/sh/releases/download/v3.12.0/shfmt_v3.12.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
      - run: shfmt -i 2 -ci -bn -d scripts/linux

  psscriptanalyzer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $PSVersionTable.PSVersion
      - run: |
          $results = Invoke-ScriptAnalyzer -Path scripts/windows -Recurse -Settings scripts/windows/PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }
